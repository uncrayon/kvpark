name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: kvpark --version
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install from the checkout in a fresh home, then rerun
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/kvpark install home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export UV_CACHE_DIR="$HOME/.cache/uv"
          export UV_PYTHON_INSTALL_DIR="$HOME/.local/share/uv/python"
          mkdir -p "$HOME"
          bash install.sh --standalone --no-setup --package "$GITHUB_WORKSPACE"
          bash install.sh --standalone --no-setup --package "$GITHUB_WORKSPACE"
          "$HOME/.local/bin/kvpark" --version
          "$HOME/.local/bin/kvpark" --help
  runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_runtime.py --jobs 2 --cmake-arg=-DGGML_METAL=OFF
      - run: python -c "import pathlib, subprocess; p = next(p for p in pathlib.Path('runtime/build/bin').rglob('*') if p.name in ('llama-server', 'llama-server.exe')); subprocess.run([str(p), '--version'], check=True)"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python scripts/check_portability.py
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  updates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build psutil packaging
      - run: python -m build --wheel
      - run: python scripts/test_update_release.py dist
      - run: python scripts/test_migration_release.py dist
  hermes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 9dd6634c5635321cf38840cc30e9b51226689128
          path: .hermes-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -e ./.hermes-test
      - run: python tests/hermes/test_integration.py -v
        env:
          PYTHONPATH: .hermes-test
      - if: runner.os != 'Windows'
        run: python -m pip install uv
      - if: runner.os != 'Windows'
        run: python scripts/test_install_hermes.py
