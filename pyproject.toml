[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvpark"
version = "0.3.0a1"
description = "Park and restore model KV caches for local AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "packaging>=23"]
license = {text = "MIT"}
authors = [{name = "Ulises Rayon"}]
keywords = ["llama.cpp", "kv-cache", "local-ai", "open-weights", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/uncrayon/kvpark"
Issues = "https://github.com/uncrayon/kvpark/issues"

[project.scripts]
kvpark = "kvpark.cli:main"

[project.entry-points."hermes_agent.plugins"]
kvpark = "kvpark.hermes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kvpark = ["update_compat.json"]
